<!--
  index.html - The single HTML page that Angular runs inside.

  Angular is a Single Page Application (SPA) framework. This means:
  - The browser loads this ONE HTML file.
  - Angular takes over the <app-root> element and renders all components inside it.
  - When you "navigate" between pages (/login, /owner, /customer), Angular swaps
    components in and out WITHOUT reloading the full page.

  KEY ELEMENTS:
  - <base href="/"> tells Angular's router that all URLs start from the root.
  - <link rel="icon"> sets the browser tab icon to the car logo.
  - The Google Fonts link loads the "Inter" font family used throughout the app.
  - <app-root> is where Angular's AppComponent gets rendered.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vehicle Telemetry System</title>
  <meta name="description" content="Connected Vehicle Telemetry Monitoring System — Real-time fleet telemetry, alerts, and dashboards.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
