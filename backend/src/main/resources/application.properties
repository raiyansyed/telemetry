# ============================================================================
# APPLICATION.PROPERTIES - Spring Boot Configuration
# ============================================================================
# This file configures how the Spring Boot backend application runs.
# Spring Boot reads this file automatically on startup.
# ============================================================================

# --- SERVER PORT ---
# The backend API runs on port 9090 (default Spring Boot port is 8080).
# The Angular frontend runs on port 4200 and makes API calls to localhost:9090.
server.port=9090

# --- DATABASE CONNECTION ---
# Connects to a MySQL database called "newtestdb" on localhost.
# createDatabaseIfNotExist=true: Automatically creates the DB if it doesn't exist.
# useSSL=false: Disables SSL for local development (don't do this in production!).
# allowPublicKeyRetrieval=true: Required for some MySQL driver versions.
# serverTimezone=UTC: Sets the timezone to avoid date/time issues.
spring.datasource.url=jdbc:mysql://localhost:3306/newtestdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Database login credentials (default MySQL root user - change in production!).
spring.datasource.username=root
spring.datasource.password=root

# --- JPA / HIBERNATE SETTINGS ---
# ddl-auto=update: Hibernate automatically creates/updates database tables
#   based on your @Entity classes. No need to write SQL CREATE TABLE statements.
#   Options: create (drop & recreate), update (alter existing), validate, none.
spring.jpa.hibernate.ddl-auto=update

# show-sql=false: If true, prints every SQL query to the console (noisy but useful for debugging).
spring.jpa.show-sql=false

# dialect: Tells Hibernate to generate MySQL-compatible SQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# format_sql=true: Pretty-prints SQL queries in logs (only visible if show-sql=true).
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (JSON Web Token) SETTINGS ---
# secret: The signing key used to create and verify JWT tokens.
#   This is a hex-encoded 256-bit key. In production, use an environment variable!
#   If someone knows this secret, they can forge authentication tokens.
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# expirationMs: How long a JWT token is valid, in milliseconds.
#   86400000ms = 24 hours. After this, the user must log in again.
app.jwt.expirationMs=86400000
